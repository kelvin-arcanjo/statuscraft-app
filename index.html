<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcanjo Labs — Otimizador de Vídeos - StatusCraft.app</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>StatusCraft</h1>
    </header>

    <main>
       <form action ="" method="post">
          <label for="video">
            Link do vídeo: <span class ="required">*</span>
          </label>

          <input type ="url" name ="video" id ="video" required> <br>

          <label for ="format">
            Destino: <span class="required">*</span>
          </label>
          <select name ="format" id ="format" required>
            <option value="">Selecione o destino:</option>
            <option value="whatsapp">Whatsapp</option>
            <option value="instagram">Instagram</option>
            <option value="facebook">Facebook</option>
          </select>

          <input type="submit" value="Enviar">
          <input type="reset" value="Limpar">
       </form> 

       <article>
        <p>A pré-visualização aparecerá aqui.</p>
       </article>
    </main>
</body>
</html>
